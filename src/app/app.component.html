<section
  class="card shadow"
  [style.--jwz-chatbot-accent]="accentColor()"
  [style.--jwz-chatbot-primary]="primaryColor()"
>
  <header class="p-4 text-white" [style.background-color]="'var(--jwz-chatbot-primary)'">
    <p class="small text-uppercase fw-bold mb-1" [style.color]="'var(--jwz-chatbot-accent)'">
      JWZ Financiële Diensten
    </p>
    <h2 class="h4 mb-2">{{ heading() }}</h2>
    <p class="mb-0">Stel uw algemene vraag en vind snel de juiste informatie.</p>
  </header>

  <div
    aria-label="Gesprek met de hypotheekassistent"
    aria-live="polite"
    class="chatbot__messages overflow-auto p-4 bg-white"
    role="log"
  >
    <ol class="list-unstyled d-flex flex-column gap-3 mb-0 p-0">
      @for (message of messages(); track message.id) {
        <li>
          <app-chat-message [message]="message" />
        </li>
      }
    </ol>
  </div>

  <p class="small text-secondary mb-0 px-3 pb-2">
    Deze chatbot geeft algemene informatie en geen persoonlijk financieel advies.
  </p>

  <app-chat-input (questionSubmitted)="askQuestion($event)" />
</section>
