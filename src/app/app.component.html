<section
  class="chatbot"
  [attr.aria-labelledby]="headingId"
  [style.--jwz-chatbot-accent]="accentColor()"
  [style.--jwz-chatbot-primary]="primaryColor()"
>
  <header class="chatbot__header">
    <p class="chatbot__eyebrow">JWZ Financiële Diensten</p>
    <h2 class="chatbot__heading" [id]="headingId">{{ heading() }}</h2>
    <p class="chatbot__introduction">Stel uw algemene vraag en vind snel de juiste informatie.</p>
  </header>

  <div
    aria-label="Gesprek met de hypotheekassistent"
    aria-live="polite"
    aria-relevant="additions text"
    class="chatbot__messages"
    role="log"
  >
    <ol class="chatbot__message-list">
      @for (message of messages(); track message.id) {
        <li class="chatbot__message">
          <app-chat-message [message]="message" />
        </li>
      }
    </ol>
  </div>

  <p class="chatbot__disclaimer" [id]="disclaimerId">
    Deze chatbot geeft algemene informatie en geen persoonlijk financieel advies.
  </p>

  <app-chat-input [describedBy]="disclaimerId" (questionSubmitted)="askQuestion($event)" />
</section>
