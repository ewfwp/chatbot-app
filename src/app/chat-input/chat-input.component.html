<form class="border-top bg-white p-3" (submit)="submit($event)">
  <label class="form-label fw-bold mb-2" for="question">Stel uw vraag</label>

  <div class="d-flex flex-column flex-sm-row gap-2">
    <input
      #input
      aria-required="true"
      autocomplete="off"
      class="form-control flex-grow-1"
      id="question"
      placeholder="Bijvoorbeeld: hoeveel hypotheek kan ik krijgen?"
      type="text"
      [attr.aria-invalid]="question().touched() && question().invalid()"
      [class.is-invalid]="question().touched() && question().invalid()"
      [formField]="question"
    />

    <button
      class="btn btn-primary flex-shrink-0"
      type="submit"
      [disabled]="question().invalid()"
      [style.background-color]="'var(--jwz-chatbot-primary)'"
      [style.border-color]="'var(--jwz-chatbot-primary)'"
    >
      Verstuur
    </button>
  </div>

  <p aria-live="polite" class="small text-danger mt-2 mb-0">
    @if (question().touched() && question().invalid()) {
      Vul een vraag in van maximaal 300 tekens.
    }
  </p>
</form>
